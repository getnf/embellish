app-id: io.github.getnf.embellish
runtime: org.gnome.Platform
runtime-version: "49"
sdk: org.gnome.Sdk
command: embellish
sdk-extensions:
  - org.freedesktop.Sdk.Extension.vala

finish-args:
    - --socket=wayland
    - --socket=fallback-x11
    - --share=ipc
    - --device=dri
    - --share=network
    - --filesystem=~/.local/share/fonts:create

cleanup:
    - /include
    - /lib/pkgconfig
    - /man
    - /share/doc
    - /share/man
    - /share/gtk-doc
    - /share/pkgconfig
    - /share/vala
    - "*.a"
    - "*.la"

modules:
    - name: embellish
      buildsystem: meson
      sources:
          - type: dir
            path: .
